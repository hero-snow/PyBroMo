[project]
name = "pybromo"
version = "0.8.1+forked.2025.10"
description = "A simulator for single molecule FRET experiments of freely diffusing particles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.4.10",
    "matplotlib>=3.10.7",
    "phconvert>=0.9.1",
    "numpy",
    "scipy",
    "tables",
]
keywords = ["single-molecule FRET smFRET biophysics confocal freely-diffusing brownian-motion simulator"]
authors = [
    {name = "Antonino Ingargiola", email = "tritemio@gmail.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Topic :: Scientific/Engineering",
]
license = "GPL-2.0-only"

[project.urls]
Homepage = "https://github.com/hero-snow/PyBroMo"
Downloads = "https://github.com/hero-snow/PyBroMo"

[dependency-groups]
dev = [
    "cython>=3.1.6",
    "fretbursts",
    "pybromo",
    "ruff>=0.14.9",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.4",
    "ty>=0.0.64",
]

[tool.uv.sources]
fretbursts = { git = "https://github.com/OpenSMFS/FRETBursts.git" }
pybromo = { workspace = true }

[tool.uv.workspace]
members = [
    ".",
]

[tool.setuptools.packages.find]
include = ["pybromo*"]
exclude = ["notebooks*"]

[build-system]
requires = ["setuptools","versioneer"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
ignore = [
    "D213",
    "COM812",
    "D203",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "C901",
    "T201",
    ]
select = ["ALL"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"versioneer.py" = ["ALL"]
"tests/**/*.py" = [
    "S101",
    "D",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "PLC0415",
    "SLF001",
    "PLR2004",
    "INP001",
    "ARG001",
    "ARG003",
    ]

select = ["ALL"]
fixable = ["ALL"]